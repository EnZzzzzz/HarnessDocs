<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">双 Harness 的开发态与交互态架构</title>
  <desc id="desc">开发态包含生成 Harness、判别 Harness 与共享交付资产；交互态只要求生成 Harness 消费 Skill、场景知识、设计指南、设计组件和轨迹数据，判别 Harness 可选。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="gen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="judge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#475569" flood-opacity=".13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#9333ea"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1400" height="900" rx="32" fill="url(#bg)"/>

  <rect x="34" y="34" width="1332" height="832" rx="30" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="12 10"/>
  <rect x="66" y="18" width="190" height="42" rx="21" fill="#4f46e5"/>
  <text x="161" y="46" fill="white" font-family="Inter, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">开发态 · 双 Harness</text>

  <path d="M70 112H665V548H1330V825H70Z" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="11 9"/>
  <rect x="88" y="92" width="282" height="42" rx="21" fill="#059669"/>
  <text x="229" y="120" fill="white" font-family="Inter, PingFang SC, sans-serif" font-size="19" font-weight="700" text-anchor="middle">交互态 · 判别 Harness 可选</text>

  <g filter="url(#shadow)">
    <rect x="100" y="164" width="520" height="342" rx="26" fill="url(#gen)" stroke="#93c5fd" stroke-width="2"/>
    <rect x="780" y="164" width="520" height="342" rx="26" fill="url(#judge)" stroke="#d8b4fe" stroke-width="2"/>
  </g>

  <circle cx="144" cy="209" r="22" fill="#2563eb"/>
  <path d="m134 209 7 7 14-16" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="204" fill="#1e3a8a" font-family="Inter, PingFang SC, sans-serif" font-size="25" font-weight="800">生成 Harness</text>
  <text x="180" y="232" fill="#64748b" font-family="Inter, PingFang SC, sans-serif" font-size="15">负责实现、修改、运行与交付</text>

  <circle cx="824" cy="209" r="22" fill="#9333ea"/>
  <path d="M814 209a10 10 0 1 0 20 0 10 10 0 1 0-20 0m17 8 9 9" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <text x="860" y="204" fill="#581c87" font-family="Inter, PingFang SC, sans-serif" font-size="25" font-weight="800">判别 Harness</text>
  <text x="860" y="232" fill="#64748b" font-family="Inter, PingFang SC, sans-serif" font-size="15">负责观察、取证、评分与批评</text>

  <g font-family="Inter, PingFang SC, sans-serif">
    <text x="132" y="282" fill="#1e40af" font-size="14" font-weight="700">上下文</text>
    <rect x="130" y="298" width="138" height="44" rx="12" fill="white" stroke="#bfdbfe"/>
    <rect x="280" y="298" width="138" height="44" rx="12" fill="white" stroke="#bfdbfe"/>
    <rect x="430" y="298" width="158" height="44" rx="12" fill="white" stroke="#bfdbfe"/>
    <text x="199" y="326" fill="#334155" font-size="16" text-anchor="middle">需求与代码库</text>
    <text x="349" y="326" fill="#334155" font-size="16" text-anchor="middle">历史修改</text>
    <text x="509" y="326" fill="#334155" font-size="16" text-anchor="middle">构建与测试结果</text>

    <text x="132" y="379" fill="#1e40af" font-size="14" font-weight="700">工具集</text>
    <rect x="130" y="394" width="102" height="48" rx="14" fill="#dbeafe"/>
    <rect x="243" y="394" width="102" height="48" rx="14" fill="#dbeafe"/>
    <rect x="356" y="394" width="102" height="48" rx="14" fill="#dbeafe"/>
    <rect x="469" y="394" width="119" height="48" rx="14" fill="#dbeafe"/>
    <text x="181" y="424" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">Bash</text>
    <text x="294" y="424" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">Write</text>
    <text x="407" y="424" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">Git</text>
    <text x="529" y="424" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">Build / Test</text>
    <rect x="130" y="458" width="458" height="30" rx="15" fill="#2563eb"/>
    <text x="359" y="479" fill="white" font-size="15" font-weight="700" text-anchor="middle">Skills · 工程实现 · 组件生成 · 故障修复</text>

    <text x="812" y="282" fill="#7e22ce" font-size="14" font-weight="700">上下文</text>
    <rect x="810" y="298" width="138" height="44" rx="12" fill="white" stroke="#e9d5ff"/>
    <rect x="960" y="298" width="138" height="44" rx="12" fill="white" stroke="#e9d5ff"/>
    <rect x="1110" y="298" width="158" height="44" rx="12" fill="white" stroke="#e9d5ff"/>
    <text x="879" y="326" fill="#334155" font-size="16" text-anchor="middle">设计目标</text>
    <text x="1029" y="326" fill="#334155" font-size="16" text-anchor="middle">品牌与参考</text>
    <text x="1189" y="326" fill="#334155" font-size="16" text-anchor="middle">评分准则</text>

    <text x="812" y="379" fill="#7e22ce" font-size="14" font-weight="700">工具集</text>
    <rect x="810" y="394" width="102" height="48" rx="14" fill="#f3e8ff"/>
    <rect x="923" y="394" width="112" height="48" rx="14" fill="#f3e8ff"/>
    <rect x="1046" y="394" width="102" height="48" rx="14" fill="#f3e8ff"/>
    <rect x="1159" y="394" width="109" height="48" rx="14" fill="#f3e8ff"/>
    <text x="861" y="424" fill="#7e22ce" font-size="16" font-weight="700" text-anchor="middle">Playwright</text>
    <text x="979" y="424" fill="#7e22ce" font-size="16" font-weight="700" text-anchor="middle">截图 / 交互</text>
    <text x="1097" y="424" fill="#7e22ce" font-size="16" font-weight="700" text-anchor="middle">A11y</text>
    <text x="1214" y="424" fill="#7e22ce" font-size="16" font-weight="700" text-anchor="middle">多模态</text>
    <rect x="810" y="458" width="458" height="30" rx="15" fill="#9333ea"/>
    <text x="1039" y="479" fill="white" font-size="15" font-weight="700" text-anchor="middle">Skills · 审美评估 · 原创性 · 工艺与功能检查</text>
  </g>

  <path d="M630 286H762" fill="none" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="696" y="274" fill="#4338ca" font-family="Inter, PingFang SC, sans-serif" font-size="15" font-weight="700" text-anchor="middle">可运行作品</text>
  <path d="M770 356H638" fill="none" stroke="#9333ea" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="704" y="382" fill="#7e22ce" font-family="Inter, PingFang SC, sans-serif" font-size="15" font-weight="700" text-anchor="middle">证据 + 评分 + 批评</text>

  <g filter="url(#shadow)">
    <rect x="100" y="602" width="1200" height="184" rx="26" fill="white" stroke="#a7f3d0" stroke-width="2"/>
  </g>
  <rect x="130" y="626" width="238" height="42" rx="21" fill="#ecfdf5"/>
  <text x="249" y="654" fill="#047857" font-family="Inter, PingFang SC, sans-serif" font-size="20" font-weight="800" text-anchor="middle">共享交付底座 · 场景包</text>
  <text x="395" y="653" fill="#64748b" font-family="Inter, PingFang SC, sans-serif" font-size="15">开发态持续沉淀，交互态按需消费</text>

  <g font-family="Inter, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <rect x="130" y="696" width="202" height="60" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <rect x="344" y="696" width="202" height="60" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="558" y="696" width="202" height="60" rx="16" fill="#faf5ff" stroke="#e9d5ff"/>
    <rect x="772" y="696" width="202" height="60" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="986" y="696" width="282" height="60" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="231" y="733" fill="#4338ca">Skill 组件</text>
    <text x="445" y="733" fill="#1d4ed8">场景知识</text>
    <text x="659" y="733" fill="#7e22ce">设计指南</text>
    <text x="873" y="733" fill="#c2410c">设计组件 / 资产</text>
    <text x="1127" y="733" fill="#047857">评审证据 / 轨迹训练数据</text>
  </g>

  <path d="M360 596V538" fill="none" stroke="#10b981" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1040 596V538" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrowPurple)"/>
  <text x="382" y="571" fill="#047857" font-family="Inter, PingFang SC, sans-serif" font-size="14" font-weight="700">交互态必选</text>
  <text x="1062" y="571" fill="#7e22ce" font-family="Inter, PingFang SC, sans-serif" font-size="14" font-weight="700">需要复验时接入</text>
</svg>
